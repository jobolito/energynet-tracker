name = "energynet-tracker-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
REPO = "jobolito/energynet-tracker"
ALLOWED_ORIGIN = "https://energynet-tracker.org"
# Private repo (editors only) that receives contact details and confidential parties as intake issues. Must be private.
PRIVATE_REPO = "jobolito/energynet-tracker-private"
# Secrets (set with `wrangler secret put <NAME>`):
#   GITHUB_TOKEN        fine-grained PAT with Contents + Pull requests write on the repo
#   OAUTH_CLIENT_ID     GitHub OAuth app for Decap CMS login
#   OAUTH_CLIENT_SECRET
